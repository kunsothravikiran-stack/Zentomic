[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zentomic"
dynamic = ["version"]
description = "Offline business IVR and AI call routing primitives"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
zentomic = "zentomic.__main__:main"

[project.urls]
Repository = "https://github.com/kunsothravikiran-stack/Zentomic"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "zentomic.__version__"}

[tool.setuptools.packages.find]
include = ["zentomic", "zentomic.*"]
namespaces = false
