name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run guarded offline test suite
        run: python -m tests

      - name: Run tests with Python assertions disabled
        run: python -O -m tests

      - name: Compile Python sources
        run: python -m compileall -q zentomic tests

      - name: Install package without runtime dependencies
        run: python -m pip install --no-deps .

      - name: Run installed CLI outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          zentomic | python -m json.tool > /dev/null
          expected_version="$(python -c 'from importlib.metadata import version; print(version("zentomic"))')"
          test "$(zentomic --version)" = "zentomic ${expected_version}"
          python -c 'from importlib.resources import files; assert files("zentomic").joinpath("py.typed").is_file()'

      - name: Run health smoke check
        run: python -m zentomic | python -m json.tool > /dev/null
